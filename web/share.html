<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeee8">
  <title>FarDrop · 文件下载</title>
  <link rel="stylesheet" href="/about/fardrop/style.css">
</head>
<body>
  <header class="top shell">
    <a class="brand" href="/about/fardrop/" aria-label="FarDrop 首页"><span class="mark" aria-hidden="true">↗</span> FarDrop</a>
    <a class="back" href="/about">← 返回博客</a>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>文件下载<span>.</span></h1>
    </div>
    <section class="panel share">
      {{if .Error}}
      <h2>下载不可用</h2>
      <p class="message">{{.Error}}</p>
      {{else}}
      <div class="share-heading">
        <span class="drop-icon" aria-hidden="true">↓</span>
        <div><h2>{{.Name}}</h2><p class="hint">{{.Size}} <span aria-hidden="true">·</span> 有效至 {{.Expires}}</p></div>
      </div>
      <a class="primary download" href="{{.Link}}">下载文件 <span aria-hidden="true">↓</span></a>
      <details>
        <summary>SHA-256 校验值</summary>
        <code>{{.Hash}}</code>
      </details>
      {{end}}
    </section>
  </main>
</body>
</html>
